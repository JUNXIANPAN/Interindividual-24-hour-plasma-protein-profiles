[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "interindividual-plasma-protein-profiles"
version = "0.1.0"
description = "Mixed-effects cosinor analysis of interindividual 24-hour plasma protein profiles"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "JUNXIANPAN" }
]
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "statsmodels>=0.14",
    "matplotlib>=3.8",
    "pyyaml",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
]

[tool.ruff]
line-length = 100
target-version = "py311"
